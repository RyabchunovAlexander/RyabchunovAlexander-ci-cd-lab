name: Pipeline

on:
  push:
    branches: [ main, break-html ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: HTML lint
        run: npx --yes htmlhint index.html

      - name: Build Docker image
        if: always()
        run: docker build --no-cache -t ci-cd-lab:v1 .

      - name: Smoke test container
        if: always()
        run: |
          docker run -d --name smoke-test -p 8080:80 ci-cd-lab:v1
          sleep 3
          curl -fsS http://localhost:8080 | grep -q "RyabchunovAlexander" || exit 1
          echo "OK"

  release:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ryabchunovalexander/ryabchunovalexander-ci-cd-lab:latest
            ghcr.io/ryabchunovalexander/ryabchunovalexander-ci-cd-lab:v1